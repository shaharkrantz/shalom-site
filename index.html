<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ff">
  <title>שלום 👋</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ff; color: #28223a; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 2rem; }
    h1 { margin: 0 0 .4rem; font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -.04em; }
    p { margin: 0; color: #68617b; font-size: 1.15rem; }
    img { display: block; width: min(330px, 75vw); height: auto; margin: 1rem auto 1.4rem; }
  </style>
</head>
<body>
  <main>
    <h1>שלום!</h1>
    <img src="hello.svg" alt="דמות חייכנית מנופפת לשלום">
    <p>איזה כיף שבאת 👋</p>
  </main>
</body>
</html>
