<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מסע האנגלית של כיתה ד׳</title><style>
:root{--navy:#183153;--blue:#3478f6;--cream:#fffaf0;--mint:#d8f6e7;--pink:#ffe2e9;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 15%,#dff4ff,transparent 28%),radial-gradient(circle at 90% 80%,#fff0d0,transparent 30%),#f5f7ff;color:var(--navy);font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:22px}.app{width:min(900px,100%);background:#ffffffed;border:1px solid #e7ebf4;border-radius:28px;box-shadow:0 20px 60px #1731531a;padding:clamp(22px,5vw,48px);position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:#eef4ff;color:#245bc0;padding:9px 14px;border-radius:30px;font-weight:700}.stars{font-size:20px;color:#bb7b00}.hero{text-align:center;padding:22px 0 12px}.emoji{font-size:60px}.hero h1{font-size:clamp(28px,5vw,44px);margin:8px 0;color:#17365d}.hero p{font-size:18px;color:#62738b;margin:0}.progress{height:10px;background:#edf0f7;border-radius:10px;margin:24px 0 28px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#44c899,#3478f6);transition:width .3s;border-radius:10px}.question{background:#f6f8fc;border-radius:22px;padding:24px;text-align:center}.prompt{font-size:18px;color:#63748a;margin-bottom:10px}.word{font-size:clamp(34px,7vw,52px);font-weight:800;direction:ltr;color:#17365d;letter-spacing:.5px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}.answer{font:700 20px inherit;font-size:20px;color:#244160;background:white;border:2px solid #e5ebf4;border-radius:16px;padding:16px 12px;cursor:pointer;transition:.15s;min-height:62px}.answer:hover:not(:disabled){border-color:#76a3ff;transform:translateY(-2px);box-shadow:0 7px 15px #3478f61a}.answer:disabled{cursor:default}.answer.good{background:var(--mint);border-color:#4cbd86;color:#17633f}.answer.bad{background:var(--pink);border-color:#ed829a;color:#9a2b44}.feedback{min-height:32px;text-align:center;font-weight:700;font-size:18px}.next{display:block;margin:8px auto 0;background:var(--blue);color:white;border:0;border-radius:14px;padding:14px 30px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 7px 15px #3478f633}.next:hover{background:#2462d4}.next:disabled{opacity:.45;cursor:not-allowed}.footer{text-align:center;color:#8390a3;font-size:14px;margin-top:20px}.result{text-align:center;padding:20px 0}.result h2{font-size:36px}.result p{font-size:21px;color:#536984}@media(max-width:520px){.answers{grid-template-columns:1fr}.top{align-items:flex-start}.question{padding:18px}}
</style></head><body><main class="app"><div class="top"><span class="badge">🎒 משחק אנגלית לכיתה ד׳</span><span class="stars" id="score">⭐ 0</span></div><section class="hero"><div class="emoji">🦊</div><h1>מסע האנגלית</h1><p>בחרו את התרגום הנכון וצברו כוכבים!</p></section><div class="progress"><div class="bar" id="bar"></div></div><section id="game"><div class="question"><div class="prompt">מה פירוש המילה באנגלית?</div><div class="word" id="word"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>לשאלה הבאה ←</button></section><div class="footer">10 שאלות • מילים, צבעים, חיות ועוד</div></main><script>
const qs=[['apple','תפוח','בננה','תפוז','ענב'],['school','בית ספר','בית חולים','חנות','פארק'],['beautiful','יפה','מהיר','קטן','רעב'],['yellow','צהוב','ירוק','סגול','שחור'],['window','חלון','דלת','כיסא','שולחן'],['hungry','רעב','עייף','שמח','צמא'],['rabbit','ארנב','אריה','ציפור','דג'],['between','בין','מתחת','מעל','ליד'],['teacher','מורה','תלמיד','רופא','טבח'],['yesterday','אתמול','מחר','היום','עכשיו']];let i=0,points=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;$('feedback').textContent='';$('next').disabled=true;$('word').textContent=qs[i][0];$('bar').style.width=(i/qs.length*100)+'%';$('score').textContent='⭐ '+points;let opts=[qs[i][1],...qs[i].slice(2)].sort(()=>Math.random()-.5);$('answers').innerHTML='';opts.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(b,v);$('answers').appendChild(b)});$('next').textContent=i===qs.length-1?'לסיום 🏁':'לשאלה הבאה ←'}function choose(btn,v){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===qs[i][1])b.classList.add('good')});if(v===qs[i][1]){points++;$('feedback').textContent='כל הכבוד! תשובה נכונה 🎉'}else{btn.classList.add('bad');$('feedback').textContent='כמעט! התשובה הנכונה מסומנת בירוק 💚'}$('score').textContent='⭐ '+points;$('next').disabled=false}function finish(){ $('bar').style.width='100%';$('game').innerHTML=`<div class="result"><div class="emoji">${points>=8?'🏆':'🌟'}</div><h2>סיימתם את המסע!</h2><p>עניתם נכון על <b>${points}</b> מתוך ${qs.length} שאלות.</p><button class="next" onclick="location.reload()">לשחק שוב 🔄</button></div>`} $('next').onclick=()=>{i++;if(i===qs.length)finish();else render()};render();
</script></body></html>
