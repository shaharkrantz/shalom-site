<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>משחק החשבון של כיתה ב׳</title>
<style>
:root{--ink:#24304b;--blue:#536dfe;--mint:#d8f7e7;--pink:#ffe0e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f0f5ff,#fff6e9);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}.game{width:min(700px,100%);background:white;border-radius:30px;padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #384b771c;text-align:center}.hero{font-size:52px;margin:4px}.eyebrow{color:#6473d9;font-weight:bold}.title{font-size:clamp(28px,6vw,40px);margin:8px 0}.sub{color:#69748c;margin:0 0 20px}.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}.topic{border:2px solid #e3e7f0;background:white;border-radius:18px;padding:17px 12px;text-align:right;font:inherit;color:var(--ink);cursor:pointer;transition:.15s}.topic:hover{border-color:var(--blue);background:#f7f8ff;transform:translateY(-2px)}.topic strong{display:block;font-size:18px;margin-bottom:5px}.topic span{font-size:14px;color:#69748c}.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#59647c}.badge{background:#f0f2ff;border-radius:99px;padding:10px 15px}.back{border:0;background:transparent;color:#5968d8;font:inherit;font-weight:bold;cursor:pointer;padding:10px}.progress{height:10px;background:#edf0f7;border-radius:8px;overflow:hidden;margin:12px 0 24px}.bar{height:100%;width:0;background:linear-gradient(90deg,#63d7a2,#536dfe);transition:width .3s}.question{background:#f7f8ff;border-radius:24px;padding:25px 16px;margin-bottom:18px}.prompt{font-size:20px;color:#5e6880;line-height:1.5}.equation{font-size:clamp(34px,9vw,62px);font-weight:800;margin:12px 0;color:#26365c;direction:ltr}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer{border:2px solid #e3e7f0;background:white;border-radius:18px;padding:18px 8px;font-size:26px;font-weight:bold;color:var(--ink);cursor:pointer}.answer:hover{border-color:var(--blue);background:#f7f8ff}.answer:disabled{cursor:default}.feedback{min-height:32px;margin:17px 0 4px;font-size:19px;font-weight:bold}.good{color:#16834f}.try{color:#be586e}.next{display:none;border:0;border-radius:14px;background:var(--blue);color:white;font-size:18px;font-weight:bold;padding:13px 25px;cursor:pointer}.footer{font-size:13px;color:#8992a5;margin-top:20px}button:focus-visible{outline:3px solid #ffb84d;outline-offset:3px}[hidden]{display:none!important}@media(max-width:420px){.answers{gap:7px}.answer{padding:14px 4px}.game{padding:20px}}
</style></head><body><main class="game" aria-live="polite"><div class="hero" aria-hidden="true">🦊</div><div class="eyebrow">מסע החשבון של נועה</div><h1 class="title">עוזרים לשועלה להגיע לאוצר!</h1>
<section id="topic-screen"><p class="sub">בוחרים נושא ומתחילים לשחק 🌈</p><div class="topics">
<button class="topic" data-topic="addsub"><strong>➕ חיבור וחיסור</strong><span>תרגילים עד 100</span></button><button class="topic" data-topic="multiplication"><strong>✖️ כפולות</strong><span>כפולות 2, 5 ו־10</span></button><button class="topic" data-topic="place"><strong>🔢 ערך הספרות</strong><span>עשרות ויחידות</span></button><button class="topic" data-topic="patterns"><strong>🧩 רצפים</strong><span>מגלים את המספר הבא</span></button><button class="topic" data-topic="words"><strong>📖 בעיות מילוליות</strong><span>פותרים סיפור קצר</span></button>
</div></section>
<section id="play-area" hidden><div class="top"><button class="back" id="back">← בחירת נושא</button><span class="badge" id="round">שאלה 1 מתוך 10</span><span class="badge">⭐ <span id="score">0</span></span></div><p class="sub" id="topic-name"></p><div class="progress"><div class="bar" id="bar"></div></div><section class="question"><div class="prompt" id="prompt">כמה זה?</div><div class="equation" id="equation"></div></section><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status"></div><button class="next" id="next">לשאלה הבאה ←</button><div class="footer">כל הכבוד על המאמץ! 🌟</div></section></main>
<script>
const TOTAL=10,$=id=>document.getElementById(id);let q=0,score=0,answer=0,locked=false,currentTopic='addsub';const topicNames={addsub:'חיבור וחיסור',multiplication:'כפולות',place:'ערך הספרות',patterns:'רצפים',words:'בעיות מילוליות'};
document.querySelectorAll('.topic').forEach(btn=>btn.onclick=()=>start(btn.dataset.topic));$('back').onclick=()=>{$('play-area').hidden=true;$('topic-screen').hidden=false};$('next').onclick=advance;
function start(topic){currentTopic=topic;q=0;score=0;$('score').textContent='0';$('topic-screen').hidden=true;$('play-area').hidden=false;$('topic-name').textContent=`נושא: ${topicNames[topic]}`;makeQuestion()}
function makeQuestion(){locked=false;$('feedback').textContent='';$('feedback').className='feedback';$('next').style.display='none';$('round').textContent=`שאלה ${q+1} מתוך ${TOTAL}`;$('bar').style.width=`${q/TOTAL*100}%`;let a,b,op,prompt='כמה זה?';
if(currentTopic==='addsub'||currentTopic==='words'){op=Math.random()<.55?'+':'−';if(op==='+'){a=Math.floor(Math.random()*51);b=Math.floor(Math.random()*(101-a));answer=a+b}else{a=Math.floor(Math.random()*81)+10;b=Math.floor(Math.random()*(a+1));answer=a-b}if(currentTopic==='words'){const obj=['תפוחים','מדבקות','גולות','ספרים','בלונים'][Math.floor(Math.random()*5)];prompt=op==='+'?`לנועה היו ${a} ${obj}, וקיבלה עוד ${b}. כמה יש לה עכשיו?`:`לדני היו ${a} ${obj}, והוא נתן ${b}. כמה נשארו לו?`}$('equation').textContent=`${a} ${op} ${b} = ?`}
else if(currentTopic==='multiplication'){const times=[2,5,10][Math.floor(Math.random()*3)],groups=Math.floor(Math.random()*10)+1;answer=times*groups;prompt='כמה יש בסך הכול?';$('equation').textContent=`${times} × ${groups} = ?`}
else if(currentTopic==='place'){const n=Math.floor(Math.random()*90)+10,tens=Math.floor(n/10)*10,ones=n%10,mode=Math.random();if(mode<.5){answer=tens;prompt=`במספר ${n}, מה ערך ספרת העשרות?`;$('equation').textContent=`${n} · עשרות = ?`}else if(mode<.8){answer=ones;prompt=`במספר ${n}, מה ספרת היחידות?`;$('equation').textContent=`${n} · יחידות = ?`}else{answer=n;prompt=`איזה מספר מורכב מ־${tens} ועוד ${ones}?`;$('equation').textContent=`${tens} + ${ones} = ?`}}
else{const step=[2,5,10][Math.floor(Math.random()*3)],start=Math.floor(Math.random()*8)*step;answer=start+3*step;$('equation').textContent=`${start}, ${start+step}, ${start+2*step}, ?`;prompt='איזה מספר בא אחר כך?'}$('prompt').textContent=prompt;
const choices=new Set([answer]);while(choices.size<3){let n=answer+(Math.random()<.5?-1:1)*(Math.floor(Math.random()*10)+1);if(n>=0&&n<=100)choices.add(n)}const arr=[...choices].sort(()=>Math.random()-.5);$('answers').replaceChildren(...arr.map(n=>{const btn=document.createElement('button');btn.className='answer';btn.textContent=n;btn.setAttribute('aria-label',`תשובה ${n}`);btn.onclick=()=>check(n,btn);return btn}))}
function check(n,btn){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(n===answer){score++;$('score').textContent=score;$('feedback').textContent=['נכון מאוד! ⭐','איזה יופי! 🎉','אלופה! 🌟'][Math.floor(Math.random()*3)];$('feedback').classList.add('good');btn.style.background='var(--mint)';btn.style.borderColor='#60c891'}else{$('feedback').textContent=`כמעט! התשובה הנכונה היא ${answer}. ממשיכים לנסות!`;$('feedback').classList.add('try');btn.style.background='var(--pink)';btn.style.borderColor='#e8889f';document.querySelectorAll('.answer').forEach(x=>{if(Number(x.textContent)===answer){x.style.background='var(--mint)';x.style.borderColor='#60c891'}})}$('next').style.display='inline-block';$('next').textContent=q===TOTAL-1?'רואים כמה כוכבים אספתי!':'לשאלה הבאה ←';$('next').focus()}
function advance(){q++;if(q<TOTAL)makeQuestion();else finish()}
function finish(){$('bar').style.width='100%';$('round').textContent='סיימנו!';$('equation').textContent='🎁';$('answers').replaceChildren();$('feedback').className='feedback good';$('feedback').innerHTML=`אספת ${score} מתוך ${TOTAL} כוכבים!<br>${score===TOTAL?'מדהים! את אלופת החשבון!':'כל הכבוד על שהתאמנת! רוצים לנסות שוב?'}`;$('next').textContent='משחקים שוב';$('next').onclick=()=>{ $('next').onclick=advance;start(currentTopic)}}
</script></body></html>
