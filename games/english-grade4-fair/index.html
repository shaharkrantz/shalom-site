<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מסע האנגלית של כיתה ד׳</title>
<style>
:root{--navy:#183153;--blue:#3478f6;--mint:#d8f6e7;--pink:#ffe2e9;--gold:#ffd166;--line:#e7ebf4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 15%,#dff4ff,transparent 28%),radial-gradient(circle at 90% 80%,#fff0d0,transparent 30%),#f5f7ff;color:var(--navy);font-family:"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:22px}.app{width:min(980px,100%);background:#ffffffed;border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 60px #1731531a;padding:clamp(22px,5vw,46px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{background:#eef4ff;color:#245bc0;padding:9px 14px;border-radius:30px;font-weight:700}.stars{font-size:20px;color:#bb7b00}.hero{text-align:center;padding:18px 0 14px}.emoji{font-size:56px}.hero h1{font-size:clamp(28px,5vw,42px);margin:7px 0;color:#17365d}.hero p{font-size:18px;color:#62738b;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}.play-area,.leaderboard{background:#f6f8fc;border-radius:22px;padding:22px}.name-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}.name-row label{font-weight:700;white-space:nowrap}.name-row input{min-width:0;width:100%;border:2px solid #e3eaf4;border-radius:12px;padding:11px 13px;font:inherit;color:var(--navy);background:#fff;outline:none}.name-row input:focus{border-color:#76a3ff} .time-row{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#596c85;font-size:14px;margin:0 2px 4px}.timer{font-weight:800;color:#245bc0}.progress{height:10px;background:#e8edf5;border-radius:10px;margin:15px 0 22px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#44c899,#3478f6);transition:width .3s;border-radius:10px}.question{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}.prompt{font-size:17px;color:#63748a;margin-bottom:8px}.word{font-size:clamp(36px,7vw,50px);font-weight:800;direction:ltr;color:#17365d}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:17px 0}.answer{font-size:19px;font-weight:700;color:#244160;background:#fff;border:2px solid #e5ebf4;border-radius:15px;padding:14px 10px;cursor:pointer;transition:.15s;min-height:58px}.answer:hover:not(:disabled){border-color:#76a3ff;transform:translateY(-2px);box-shadow:0 7px 15px #3478f61a}.answer:disabled{cursor:default}.answer.good{background:var(--mint);border-color:#4cbd86;color:#17633f}.answer.bad{background:var(--pink);border-color:#ed829a;color:#9a2b44}.feedback{min-height:30px;text-align:center;font-weight:700;font-size:17px}.next{display:block;margin:7px auto 0;background:var(--blue);color:white;border:0;border-radius:14px;padding:13px 26px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 7px 15px #3478f633}.next:hover{background:#2462d4}.next:disabled{opacity:.45;cursor:not-allowed}.leaderboard h2{font-size:22px;margin:0 0 5px}.leaderboard .hint{font-size:13px;color:#75849a;margin:0 0 15px}.leaderboard ol{list-style:none;padding:0;margin:0;display:grid;gap:9px}.leaderboard li{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);padding:10px;border-radius:13px}.rank{font-size:18px}.player{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .points{font-weight:800;color:#245bc0;white-space:nowrap;text-align:left}.points small{display:block;font-size:12px;color:#74849a;font-weight:600;text-align:left;margin-top:3px}.empty{background:white;border:1px dashed #cbd5e3;border-radius:13px;padding:14px;text-align:center;color:#74849a;font-size:14px}.result{text-align:center;padding:20px 0}.result h2{font-size:32px;margin:8px 0}.result p{font-size:19px;color:#536984}.footer{text-align:center;color:#8390a3;font-size:13px;margin-top:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.leaderboard{order:2}}@media(max-width:480px){body{padding:12px}.answers{grid-template-columns:1fr}.play-area,.leaderboard{padding:16px}.name-row{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="app">
<div class="top"><span class="badge">🎒 משחק אנגלית לכיתה ד׳</span><span class="stars" id="score">⭐ 0</span></div>
<section class="hero"><div class="emoji">🦊</div><h1>מסע האנגלית</h1><p>בכל סיבוב מחכות לכם 10 שאלות חדשות!</p></section>
<div class="layout">
<section class="play-area">
<div class="name-row"><label for="playerName">שם השחקן/ית:</label><input id="playerName" maxlength="18" placeholder="לדוגמה: נועה" autocomplete="nickname"></div>
<div class="time-row"><span id="timer" class="timer">⏱️ 0 שניות</span><span>בשוויון בניקוד, הזמן הקצר מנצח</span></div><div class="progress"><div class="bar" id="bar"></div></div>
<section id="game"><div class="result"><p>כתבו את שם השחקן/ית ולחצו להתחיל. השעון יתחיל רק אז ⏱️</p><button class="next" id="startGame">להתחיל את המשחק 🎮</button></div></section>
</section>
<aside class="leaderboard"><h2>🏆 עשרת המובילים</h2><p class="hint">קודם לפי ניקוד, ואז לפי זמן</p><div id="leaderboardList"></div></aside>
</div><div class="footer">השאלות מתחלפות בכל משחק • השיאים נשמרים בדפדפן הזה</div>
</main>
<script>
const bank=[
['apple','תפוח','בננה','תפוז','ענב'],['school','בית ספר','בית חולים','חנות','פארק'],['beautiful','יפה','מהיר','קטן','רעב'],['yellow','צהוב','ירוק','סגול','שחור'],['window','חלון','דלת','כיסא','שולחן'],['hungry','רעב','עייף','שמח','צמא'],['rabbit','ארנב','אריה','ציפור','דג'],['between','בין','מתחת','מעל','ליד'],['teacher','מורה','תלמיד','רופא','טבח'],['yesterday','אתמול','מחר','היום','עכשיו'],
['family','משפחה','חברים','שכנים','כיתה'],['garden','גינה','מטבח','חוף','רחוב'],['morning','בוקר','ערב','לילה','צהריים'],['always','תמיד','אף פעם','לפעמים','מחר'],['thirsty','צמא','רעב','עייף','כועס'],['kitchen','מטבח','חדר שינה','גינה','משרד'],['cloudy','מעונן','שמשי','גשום','חם'],['butterfly','פרפר','דבורה','נמלה','עכביש'],['behind','מאחורי','לפני','בתוך','מעל'],['borrow','לשאול בהשאלה','לזרוק','לצייר','לספור'],
['breakfast','ארוחת בוקר','ארוחת ערב','קינוח','כריך'],['careful','זהיר','רועש','עצלן','מהיר'],['mountain','הר','נהר','יער','אי'],['friendly','ידידותי','עצוב','רעב','קשה'],['usually','בדרך כלל','לעולם לא','בדיוק','פתאום'],['climb','לטפס','לשחות','לרקוד','לישון'],['different','שונה','דומה','שקט','טעים'],['weather','מזג אוויר','שיעורי בית','חופשה','צעצוע'],['library','ספרייה','מגרש','מוזיאון','מסעדה'],['because','בגלל','למרות','אחרי','לפני'],
['quiet','שקט','רועש','מהיר','מתוק'],['sometimes','לפעמים','תמיד','אף פעם','מייד'],['favorite','מועדף','רחוק','חשוך','רעב'],['country','מדינה','כפר','כיתה','תחנה'],['strong','חזק','חלש','איטי','קטן'],['inside','בפנים','בחוץ','למעלה','מאחור'],['remember','לזכור','לשכוח','לשאול','לענות'],['weekend','סוף שבוע','יום הולדת','חופשה','אמצע שבוע'],['early','מוקדם','מאוחר','קרוב','קצר'],['carefully','בזהירות','בשמחה','בקול רם','במהירות']
];
const $=id=>document.getElementById(id),key='grade4EnglishLeaderboardV2',roundSize=10;let deck=[],round=[],index=0,points=0,locked=false,saved=false,startAt=0,timerHandle=null,finalSeconds=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function readScores(){try{const x=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function showLeaders(){const list=$('leaderboardList'),scores=readScores().sort((a,b)=>b.score-a.score||a.seconds-b.seconds||a.date-b.date).slice(0,10);if(!scores.length){list.innerHTML='<div class="empty">עוד אין תוצאות. שחקו כדי להופיע כאן!</div>';return}const ol=document.createElement('ol');scores.forEach((r,n)=>{const li=document.createElement('li'),rank=n<3?['🥇','🥈','🥉'][n]:String(n+1);li.innerHTML='<span class="rank">'+rank+'</span><span class="player"></span><span class="points">'+r.score+'/10 ⭐<small>'+formatTime(r.seconds)+'</small></span>';li.querySelector('.player').textContent=r.name;ol.appendChild(li)});list.replaceChildren(ol)}
function formatTime(s){const n=Math.max(0,Number(s)||0),m=Math.floor(n/60),r=n%60;return m?m+' דק׳ '+r+' שנ׳':n+' שניות'}function updateTimer(){$('timer').textContent='⏱️ '+formatTime(Math.floor((Date.now()-startAt)/1000))}function saveScore(seconds){if(saved)return;saved=true;const name=$('playerName').value.trim().slice(0,18)||'שחקן/ית',scores=readScores();scores.push({name,score:points,seconds,date:Date.now()});try{localStorage.setItem(key,JSON.stringify(scores.sort((a,b)=>b.score-a.score||a.seconds-b.seconds||a.date-b.date).slice(0,10)))}catch{}showLeaders()}
function startGame(){if(deck.length<roundSize)deck=shuffle([...bank]);round=deck.splice(0,roundSize);index=0;points=0;locked=false;saved=false;startAt=Date.now();finalSeconds=0;if(timerHandle)clearInterval(timerHandle);$('timer').textContent='⏱️ 0 שניות';timerHandle=setInterval(updateTimer,250);$('score').textContent='⭐ 0';$('game').innerHTML='<div class="question"><div class="prompt">מה פירוש המילה באנגלית?</div><div class="word" id="word"></div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>לשאלה הבאה ←</button>';render();$('next').onclick=next}
function render(){locked=false;$('feedback').textContent='';$('next').disabled=true;$('word').textContent=round[index][0];$('bar').style.width=(index/roundSize*100)+'%';const opts=shuffle(round[index].slice(1));$('answers').replaceChildren();opts.forEach(v=>{const b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>choose(b,v);$('answers').appendChild(b)});$('next').textContent=index===roundSize-1?'לסיום 🏁':'לשאלה הבאה ←'}
function choose(btn,v){if(locked)return;locked=true;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===round[index][1])b.classList.add('good')});if(v===round[index][1]){points++;$('feedback').textContent='כל הכבוד! תשובה נכונה 🎉'}else{$('feedback').textContent='כמעט! התשובה הנכונה מסומנת בירוק 💚'}$('score').textContent='⭐ '+points;$('next').disabled=false}
function next(){index++;if(index===roundSize){finish();return}render()}
function finish(){finalSeconds=Math.max(1,Math.floor((Date.now()-startAt)/1000));if(timerHandle)clearInterval(timerHandle);$('timer').textContent='⏱️ '+formatTime(finalSeconds);saveScore(finalSeconds);$('bar').style.width='100%';$('game').innerHTML='<div class="result"><div class="emoji">'+(points>=8?'🏆':'🌟')+'</div><h2>סיימתם את המסע!</h2><p>עניתם נכון על <b>'+points+'</b> מתוך '+roundSize+' שאלות.</p><p>הזמן שלכם: <b>'+formatTime(finalSeconds)+'</b></p><button class="next" id="playAgain">למשחק חדש עם שאלות אחרות 🔄</button></div>';$('playAgain').onclick=startGame}
showLeaders();$('startGame').onclick=startGame;
</script></body></html>
